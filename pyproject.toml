[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trivia-mcp-server"
version = "0.1.0"
description = "An MCP server that lets Claude host a trivia game: random questions, answer checking, scoring and categories."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "StavrosKoum" }]
dependencies = [
    "mcp[cli]>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
trivia-mcp-server = "trivia_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trivia_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
